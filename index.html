<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- Rendu du Markdown des réponses de Claude (titres, listes, gras...) dans le panneau chat.
       marked = parseur Markdown -> HTML ; DOMPurify = nettoie ce HTML pour empêcher toute
       injection de script (sécurité, même si la source est censée être fiable). -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.0.6/dist/purify.min.js"></script>
</head>
<body>

  <!-- Grille principale du dashboard : 9 zones, voir layout_dashboard_etape1.md -->
  <main class="dashboard">

    <!-- Bloc notes rapide -->
    <section class="zone zone-notes" title="Notes / Notes">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 5a2 2 0 0 1 2 -2h10a2 2 0 0 1 2 2v14a2 2 0 0 1 -2 2h-10a2 2 0 0 1 -2 -2l0 -14" />
        <path d="M9 7l6 0" />
        <path d="M9 11l6 0" />
        <path d="M9 15l4 0" />
      </svg>
    </section>

    <!-- Tâches urgent / pas urgent -->
    <section class="zone zone-taches" title="Tâches / Tasks">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 5.5l1.5 1.5l2.5 -2.5" />
        <path d="M3.5 11.5l1.5 1.5l2.5 -2.5" />
        <path d="M3.5 17.5l1.5 1.5l2.5 -2.5" />
        <path d="M11 6l9 0" />
        <path d="M11 12l9 0" />
        <path d="M11 18l9 0" />
      </svg>
    </section>

    <!-- Mails triés urgent / pas urgent -->
    <section class="zone zone-gmail" title="Mail / Mail">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 7a2 2 0 0 1 2 -2h14a2 2 0 0 1 2 2v10a2 2 0 0 1 -2 2h-14a2 2 0 0 1 -2 -2v-10" />
        <path d="M3 7l9 6l9 -6" />
      </svg>
    </section>

    <!-- Suggestions Claude : zone mise en avant (fond accent) -->
    <section class="zone zone-suggestion zone-accent" title="Suggestions / Suggestions">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12h1m8 -9v1m8 8h1m-15.4 -6.4l.7 .7m12.1 -.7l-.7 .7" />
        <path d="M9 16a5 5 0 1 1 6 0a3.5 3.5 0 0 0 -1 3a2 2 0 0 1 -4 0a3.5 3.5 0 0 0 -1 -3" />
        <path d="M9.7 17l4.6 0" />
      </svg>
    </section>

    <!-- Vue semaine Google Calendar : icône seule tant que fermé, liste au clic -->
    <section id="zone-calendrier" class="zone zone-calendrier" title="Calendrier / Calendar (clic pour la semaine)">
      <svg id="icone-calendrier" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7a2 2 0 0 1 2 -2h12a2 2 0 0 1 2 2v12a2 2 0 0 1 -2 2h-12a2 2 0 0 1 -2 -2v-12" />
        <path d="M16 3v4" />
        <path d="M8 3v4" />
        <path d="M4 11h16" />
        <path d="M11 15h1" />
        <path d="M12 15v3" />
      </svg>
      <div id="panneau-calendrier" class="panneau-calendrier" hidden>
        <div id="jours-semaine" class="jours-semaine"></div>
        <div id="detail-jour" class="detail-jour" hidden></div>
      </div>
    </section>

    <!-- Chat Claude : zone mise en avant (fond accent), icône seule tant que fermé -->
    <section id="zone-chat" class="zone zone-chat zone-accent" title="Chat / Chat (clic pour ouvrir)">
      <svg id="icone-chat" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 20l1.3 -3.9c-2.324 -3.437 -1.426 -7.872 2.1 -10.374c3.526 -2.501 8.59 -2.296 11.845 .48c3.255 2.777 3.695 7.266 1.029 10.501c-2.666 3.235 -7.615 4.215 -11.574 2.293l-4.7 1" />
      </svg>
      <div id="panneau-chat" class="panneau-chat" hidden>
        <div id="messages-chat" class="messages-chat"></div>
        <form id="form-chat">
          <input id="saisie-chat" type="text" placeholder="Écris un message…" autocomplete="off">
        </form>
      </div>
    </section>

    <!-- Suivi des coûts API : icône seule par défaut, détail affiché au clic -->
    <section id="zone-couts" class="zone zone-couts" title="Coûts / Costs (clic pour le détail)">
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M16.7 8a3 3 0 0 0 -2.7 -2h-4a3 3 0 0 0 0 6h4a3 3 0 0 1 0 6h-4a3 3 0 0 1 -2.7 -2" />
        <path d="M12 3v3m0 12v3" />
      </svg>
      <div id="detail-couts" class="detail-couts" hidden></div>
    </section>

    <!-- Colonne étroite : journal d'activité + stats, deux mini-icônes empilées -->
    <div class="zone zone-misc">
      <button class="icon-btn" title="Journal d'activité / Activity log">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 8l0 4l2 2" />
          <path d="M3.05 11a9 9 0 1 1 .5 4m-.5 5v-5h5" />
        </svg>
      </button>
      <button class="icon-btn" title="Stats / Stats">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 13a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v6a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -6" />
          <path d="M15 9a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -10" />
          <path d="M9 5a1 1 0 0 1 1 -1h4a1 1 0 0 1 1 1v14a1 1 0 0 1 -1 1h-4a1 1 0 0 1 -1 -1l0 -14" />
          <path d="M4 20h14" />
        </svg>
      </button>

      <!-- Bascule Ollama (défaut) / API Anthropic pour toutes les fonctionnalités IA -->
      <button id="btn-provider" class="icon-btn" title="Ollama (local, gratuit) / Anthropic (API, payant)">
        <svg id="icone-provider" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 12a2 2 0 1 0 4 0a2 2 0 1 0 -4 0" />
          <path d="M2 12a6 6 0 0 1 6 -6h8a6 6 0 0 1 6 6a6 6 0 0 1 -6 6h-8a6 6 0 0 1 -6 -6" />
        </svg>
      </button>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
